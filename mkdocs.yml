site_name: OpenRed Documentation
site_description: Open-source platform for environmental measurement data collection and management
site_author: Ibercivis - OpenRed Team
site_url: https://openred.io

repo_name: Ibercivis/OpenRed
repo_url: https://github.com/Ibercivis/OpenRed
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow

plugins:
  - search
  - with-pdf:
      author: Ibercivis - OpenRed Team
      copyright: '2025 OpenRed Project'
      cover_title: OpenRed Documentation
      cover_subtitle: Environmental Measurement Platform - Complete Technical Reference
      cover_logo: null
      output_path: pdf/openred-documentation.pdf
      enabled_if_env: ENABLE_PDF_EXPORT
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_category_heading: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quick-start.md
      - Configuration: getting-started/configuration.md
  - Architecture:
      - Overview: architecture/overview.md
      - Data Hierarchy: architecture/data-hierarchy.md
      - Apps Structure: architecture/apps-structure.md
      - Background Jobs: architecture/background-jobs.md
  - API Reference:
      - Missions API: api-reference/missions.md
      - Measurements API: api-reference/measures.md
  - User Guides:
      - Uploading Tracks: guides/uploading-tracks.md
      - DateTime Fields: guides/datetime-fields.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Ibercivis/OpenRed
  version:
    provider: mike

extra_css:
  - stylesheets/extra.css
