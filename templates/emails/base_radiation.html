{% extends "emails/base.html" %}
{% comment %}Cabecera "OpenRed Radiación" con el trébol (cid:chart_logo, adjuntado por el código de envío).{% endcomment %}
{% block brand %}
  <table role="presentation" cellpadding="0" cellspacing="0"><tr>
    <td style="padding-right:12px;vertical-align:middle;"><img src="cid:chart_logo" width="44" height="44" alt="Radiación" style="display:block;border:0;"></td>
    <td style="vertical-align:middle;">
      <a href="{{ site_url }}" style="color:#ffffff;text-decoration:none;font-size:22px;font-weight:700;letter-spacing:0.5px;">OpenRed <span style="color:#facc15;">Radiación</span></a>
      <div style="color:#94a3b8;font-size:12px;margin-top:4px;">Ciencia ciudadana · Radiación gamma ambiental</div>
    </td>
  </tr></table>
{% endblock %}
