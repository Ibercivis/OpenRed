; OpenRed worker for the periodic emails (monthly report, personal digest).
;
; Heavy and slow (matplotlib charts, map tiles, reverse geocoding), so it has its own queue,
; 'openred-emails', and one worker: it never competes with track uploads (openred-tracks) or
; the weather / station watchdog (openred-weather). The hourly check that decides WHEN to send
; (check_scheduled_emails) stays on openred-weather; it only enqueues the real work here.
;
; Install (run on the server):
;   sudo cp deploy/supervisor/openred-emails.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread && sudo supervisorctl update

[program:openred-emails]
command=/home/ubuntu/openred-api/.venv/bin/python manage.py rqworker openred-emails
directory=/home/ubuntu/openred-api
user=ubuntu
group=ubuntu
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/openred-emails.log
environment=DJANGO_SETTINGS_MODULE=openred.settings,PATH="/home/ubuntu/openred-api/.venv/bin"
