; OpenRed RQ scheduler daemon (the piece that was missing).
;
; rqworkers (openred-tracks, openred-weather) only EXECUTE jobs already in a queue.
; This daemon is what moves time-based jobs (RQ_JOBS) from Redis's scheduled set
; into the openred-weather queue when they're due. Without it, nothing periodic
; fires (weather sweeper/fetch, movement grouping, station watchdog).
;
; It watches the same connection the jobs are scheduled on: get_scheduler('openred-weather').
;
; Install (run on the server):
;   sudo cp deploy/supervisor/openred-rq-scheduler.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread && sudo supervisorctl update
;   sudo supervisorctl start openred-rq-scheduler
;
; The recurring jobs must be registered in Redis once (and after any RQ_JOBS change):
;   .venv/bin/python manage.py init_rq_scheduler

[program:openred-rq-scheduler]
command=/home/ubuntu/openred-api/.venv/bin/python manage.py rqscheduler --queue openred-weather
directory=/home/ubuntu/openred-api
user=ubuntu
group=ubuntu
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/openred-rq-scheduler.log
environment=DJANGO_SETTINGS_MODULE=openred.settings,PATH="/home/ubuntu/openred-api/.venv/bin"
