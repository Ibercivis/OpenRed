{% extends 'frontend/base.html' %}

{% block title %}Registrarse - OpenRed{% endblock %}

{% block base_content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h3>Crear cuenta</h3>
                </div>
                <div class="card-body">
                    <div id="error-message" class="alert alert-danger d-none"></div>
                    <div id="success-message" class="alert alert-success d-none"></div>
                    
                    <form id="register-form">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" name="email" required>
                        </div>
                        <div class="mb-3">
                            <label for="password1" class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="password1" name="password1" required>
                            <div class="form-text">Mínimo 8 caracteres</div>
                        </div>
                        <div class="mb-3">
                            <label for="password2" class="form-label">Confirmar contraseña</label>
                            <input type="password" class="form-control" id="password2" name="password2" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Registrarse</button>
                    </form>
                    
                    <div class="mt-3 text-center">
                        <p>¿Ya tienes cuenta? <a href="/login/">Inicia sesión aquí</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('register-form').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const email = document.getElementById('email').value;
        const password1 = document.getElementById('password1').value;
        const password2 = document.getElementById('password2').value;
        const csrftoken = getCookie('csrftoken');
        
        // Hide previous messages
        document.getElementById('error-message').classList.add('d-none');
        document.getElementById('success-message').classList.add('d-none');
        
        // Validate passwords match
        if (password1 !== password2) {
            document.getElementById('error-message').textContent = 'Las contraseñas no coinciden.';
            document.getElementById('error-message').classList.remove('d-none');
            return;
        }
        
        fetch('/dj-rest-auth/registration/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': csrftoken
            },
            credentials: 'include',
            body: JSON.stringify({
                email: email,
                password1: password1,
                password2: password2
            })
        })
        .then(response => response.json().then(data => ({status: response.status, body: data})))
        .then(result => {
            if (result.status === 201) {
                document.getElementById('success-message').textContent = '¡Registro exitoso! Por favor, verifica tu email para activar tu cuenta.';
                document.getElementById('success-message').classList.remove('d-none');
                // Clear form
                document.getElementById('register-form').reset();
            } else {
                let errorMessage = 'Error al registrarse. ';
                if (result.body.email) {
                    errorMessage += 'Email: ' + result.body.email.join(' ');
                } else if (result.body.password1) {
                    errorMessage += 'Contraseña: ' + result.body.password1.join(' ');
                } else if (result.body.password2) {
                    errorMessage += 'Confirmación: ' + result.body.password2.join(' ');
                } else if (result.body.non_field_errors) {
                    errorMessage += result.body.non_field_errors.join(' ');
                } else if (result.body.detail) {
                    errorMessage += result.body.detail;
                } else {
                    errorMessage += JSON.stringify(result.body);
                }
                document.getElementById('error-message').textContent = errorMessage;
                document.getElementById('error-message').classList.remove('d-none');
            }
        })
        .catch(error => {
            console.error('Error:', error);
            document.getElementById('error-message').textContent = 'Error de conexión. Por favor, inténtalo de nuevo.';
            document.getElementById('error-message').classList.remove('d-none');
        });
    });
</script>
{% endblock %}
